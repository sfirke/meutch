version: 2
updates:
  - package-ecosystem: pip
    directory: /
    # Bumps land on staging first so they deploy there before reaching main.
    target-branch: staging
    schedule:
      interval: weekly
    groups:
      # One PR for routine bumps; majors still arrive individually for review.
      pip-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
