{% extends "base.html" %}

{% block title %}Edit item{% endblock %}

{% block content %}
<div class="form-page">
    <h1>Edit item</h1>
    <form method="post" enctype="multipart/form-data">
        {{ form.csrf_token }}

        {% include "main/_item_fields.html" %}

        <div class="form-actions">
            {{ form.submit(class="btn btn-primary") }}
            <a href="{{ url_for('main.item_detail', item_id=item.id) }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>

{% include "main/_item_form_scripts.html" %}
{% endblock %}
