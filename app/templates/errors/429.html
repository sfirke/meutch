{% extends "base.html" %}

{% block title %}Slow down{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-8 col-lg-6">
        <img src="{{ url_for('static', filename='img/logo_handshake.png') }}" alt="Meutch handshake" class="hero-logo mb-4">
        <h1 class="display-4 fw-bold mb-3">That's a lot at once!</h1>
        <p class="lead text-muted mb-4">
            We've had too many attempts from your connection in a short time.<br>
            Please wait a while, then try again.
        </p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">
            <i class="fas fa-home me-2"></i>Go Home
        </a>
    </div>
</div>
{% endblock %}
